<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advertisement scheduled - WALL</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231B1D1F'/><rect x='11' y='6' width='10' height='19' rx='2' fill='%235C4BFF'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&display=swap" rel="stylesheet">
<style>
:root{--panel:#E6E9E4;--panel-2:#F4F6F2;--ink:#1F2225;--steel:#5C625E;--hair:#CBD1CA;--volt:#3826F0;}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;background:var(--panel);color:var(--ink);font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.5;}
a{color:inherit;text-decoration:none;}
.shell{width:min(100% - 40px,960px);margin:0 auto;}
header{border-bottom:1px solid var(--hair);}
.nav{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:16px 0;}
.wordmark{font-size:1.5rem;font-weight:800;letter-spacing:-.03em;}.wordmark b{color:var(--volt);}
.nav a:last-child{color:var(--steel);font-size:.9rem;}
main{padding:clamp(72px,12vw,150px) 0;}
.panel{max-width:700px;margin:0 auto;background:var(--panel-2);border:1px solid var(--hair);border-radius:3px;padding:clamp(28px,6vw,64px);}
.eyebrow{color:var(--volt);font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;}
h1{margin:12px 0 20px;font-size:clamp(2.6rem,7vw,5rem);font-weight:800;letter-spacing:-.03em;line-height:.95;}
p{max-width:55ch;color:var(--steel);}
.reference{margin-top:28px;padding-top:18px;border-top:1px solid var(--hair);font-size:.88rem;}
.reference strong{color:var(--ink);}
.btn{display:inline-flex;margin-top:30px;padding:12px 18px;border-radius:3px;background:var(--ink);color:var(--panel-2);font-weight:700;}.btn:hover{background:var(--volt);}
</style>
</head>
<body>
<header><div class="shell nav"><a href="index.html" class="wordmark">WALL<b>.</b></a><a href="sites.html">Back to WALL</a></div></header>
<main class="shell">
  <section class="panel">
    <div class="eyebrow">Payment received</div>
    <h1>Your advertisment is scheduled.</h1>
    <p>Thanks for booking with WALL. We have received your payment and your advertisement booking is now being scheduled. We will use your contact email to send the booking details and next steps.</p>
    <p class="reference" id="reference" hidden>Order reference: <strong></strong></p>
    <a class="btn" href="sites.html">Back to WALL</a>
  </section>
</main>
<script>
  const order = new URLSearchParams(location.search).get('order');
  if (order) {
    const reference = document.getElementById('reference');
    reference.hidden = false;
    reference.querySelector('strong').textContent = order;
  }
</script>
</body>
</html>
