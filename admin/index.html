<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Access Check</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f172a;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    max-width: 480px;
    width: 90%;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 32px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .status {
    font-size: 0.95rem;
    color: #94a3b8;
    margin-bottom: 20px;
  }
  .row {
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 0.9rem;
    line-height: 1.6;
  }
  .row div { display: flex; justify-content: space-between; gap: 12px; }
  .row span.label { color: #94a3b8; }
  .row span.val { font-family: ui-monospace, monospace; word-break: break-all; text-align: right; }
  .ok { color: #4ade80; }
  .warn { color: #fbbf24; }
  footer { margin-top: 20px; font-size: 0.8rem; color: #64748b; }
</style>
</head>
<body>
  <div class="card">
    <h1>🔒 Admin — Hello World</h1>
    <p class="status" id="status">Checking Cloudflare Access...</p>
    <div class="row">
      <div><span class="label">Authenticated as</span><span class="val" id="email">—</span></div>
      <div><span class="label">Access JWT present</span><span class="val" id="jwt">—</span></div>
    </div>
    <footer>This page just confirms Cloudflare Access is gating <code>/admin</code> and passing identity through. No display controls live here yet.</footer>
  </div>

<script>
  fetch('/api/whoami')
    .then(r => r.json())
    .then(data => {
      document.getElementById('email').textContent = data.email || '(not provided)';
      document.getElementById('jwt').textContent = data.hasJwt ? 'yes' : 'no';
      const statusEl = document.getElementById('status');
      if (data.email) {
        statusEl.textContent = 'Access is working — identity confirmed.';
        statusEl.className = 'ok';
      } else {
        statusEl.textContent = 'Page loaded, but no Access identity header was found (Access may not be enabled on this path yet, or the function isn\'t deployed).';
        statusEl.className = 'warn';
      }
    })
    .catch(err => {
      document.getElementById('status').textContent = 'Could not reach /api/whoami — is the function deployed?';
      document.getElementById('status').className = 'warn';
    });
</script>
</body>
</html>
