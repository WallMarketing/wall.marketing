<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin</title>
<meta name="theme-color" content="#E6E9E4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&display=swap" rel="stylesheet">
<style>
  :root {
    --panel: #E6E9E4;
    --panel-2: #F4F6F2;
    --graphite: #1B1D1F;
    --ink: #1F2225;
    --steel: #5C625E;
    --hair: #CBD1CA;
    --volt: #3826F0;
    --volt-2: #8878FF;
    --chalk: #EDEFEC;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body, h1, h2, p { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--panel);
    color: var(--ink);
    font-family: Archivo, "Helvetica Neue", Arial, system-ui, sans-serif;
    font-size: clamp(16px, 1.05vw, 17.5px);
    line-height: 1.55;
    font-variation-settings: "wdth" 100, "wght" 400;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  button, canvas { font: inherit; }
  :focus-visible { outline: 2px solid var(--volt); outline-offset: 3px; border-radius: 2px; }
  header {
    position: sticky;
    top: 0;
    z-index: 1200;
    background: color-mix(in srgb, var(--panel) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--hair);
  }
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    max-width: 1180px;
    margin: 0 auto;
    padding: 16px clamp(20px, 5vw, 48px);
  }
  .wordmark {
    color: var(--ink);
    font-size: 1.5rem;
    font-variation-settings: "wdth" 125, "wght" 800;
    letter-spacing: -.03em;
    line-height: .98;
    text-decoration: none;
  }
  .wordmark b { color: var(--volt); font-weight: inherit; }
  .nav-link {
    color: #3A3E40;
    font-size: .92rem;
    padding: 6px 0;
    border-bottom: 1px solid transparent;
    text-decoration: none;
  }
  .nav-link:hover { color: var(--ink); border-bottom-color: var(--volt); }
  main { padding: clamp(52px, 7vw, 96px) 20px clamp(70px, 9vw, 124px); }
  .wrap { max-width: 1440px; margin: 0 auto; }
  .whoami {
    color: var(--steel);
    font-size: .82rem;
    margin-bottom: 12px;
  }
  h1, h2 {
    font-variation-settings: "wdth" 118, "wght" 800;
    letter-spacing: -.022em;
    line-height: .98;
    text-wrap: balance;
  }
  h1 { font-size: clamp(2.7rem, 6.4vw, 4.2rem); letter-spacing: -.03em; margin-bottom: clamp(34px, 5vw, 62px); }
  .card {
    background: var(--panel-2);
    border: 1px solid var(--hair);
    border-radius: 3px;
    padding: clamp(24px, 3vw, 34px);
    margin-bottom: 18px;
  }
  .card h2 { font-size: clamp(1.35rem, 2.4vw, 1.7rem); margin-bottom: 20px; }
  canvas {
    width: 100%;
    max-width: 560px;
    aspect-ratio: 800 / 480;
    border-radius: 3px;
    border: 1px solid var(--hair);
    image-rendering: pixelated;
    display: block;
    margin: 0 auto 16px;
    background: #fff;
  }
  button {
    background: var(--ink);
    color: var(--panel-2);
    border: 1px solid transparent;
    border-radius: 3px;
    padding: 11px 18px;
    font-size: .9rem;
    font-variation-settings: "wdth" 108, "wght" 600;
    cursor: pointer;
    transition: background .18s ease, color .18s ease, border-color .18s ease;
  }
  button:hover { background: var(--volt); }
  button:disabled { background: var(--hair); color: var(--steel); cursor: default; }
  .status {
    margin-top: 12px;
    font-size: .85rem;
    color: var(--steel);
    min-height: 1.2em;
  }
  table { width: 100%; min-width: 0; border-collapse: collapse; font-size: .82rem; }
  th, td {
    text-align: left;
    padding: 8px 7px;
    border-bottom: 1px solid var(--hair);
  }
  th { color: var(--steel); font-weight: 600; }
  .card:has(table) { overflow-x: visible; }
  .card:has(#devicesBody) table { table-layout: fixed; }
  .card:has(#devicesBody) th, .card:has(#devicesBody) td { overflow-wrap: anywhere; }
  .card:has(#devicesBody) th:nth-child(1) { width: 13%; }
  .card:has(#devicesBody) th:nth-child(2), .card:has(#devicesBody) th:nth-child(3) { width: 12%; }
  .card:has(#devicesBody) th:nth-child(4) { width: 10%; }
  .card:has(#devicesBody) th:nth-child(5), .card:has(#devicesBody) th:nth-child(6), .card:has(#devicesBody) th:nth-child(7), .card:has(#devicesBody) th:nth-child(8), .card:has(#devicesBody) th:nth-child(9) { width: 6%; }
  .card:has(#devicesBody) th:nth-child(10) { width: 10%; }
  .card:has(#devicesBody) th:nth-child(11) { width: 9%; }
  .preview-btn {
    padding: 5px 12px;
    font-size: .8rem;
  }
  .image-cell { white-space: nowrap; }
  .last-seen-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 0;
    background: transparent;
    color: var(--ink);
    border: 0;
    font: inherit;
    text-align: left;
    text-decoration: underline;
    text-decoration-color: var(--hair);
    text-underline-offset: 3px;
  }
  .last-seen-btn:hover { background: transparent; color: var(--volt); }
  .last-seen-btn:focus-visible { outline: 2px solid var(--volt); outline-offset: 3px; }
  .site-edit-cell { min-width: 150px; }
  .site-input {
    width: 100%;
    min-width: 130px;
    background: #fff;
    border: 1px solid var(--hair);
    border-radius: 3px;
    color: var(--ink);
    padding: 7px 8px;
    font-size: .82rem;
  }
  .site-input:focus { border-color: var(--volt); outline: none; }
  .location-editor { position: relative; }
  .location-suggestions {
    position: static;
    margin-top: 3px;
    display: grid;
    background: var(--panel-2);
    border: 1px solid var(--hair);
    border-radius: 3px;
    box-shadow: 0 8px 18px -12px rgba(27,29,31,.8);
    overflow: hidden;
  }
  .location-suggestion {
    display: block;
    width: 100%;
    padding: 8px 10px;
    background: var(--panel-2);
    color: var(--ink);
    border: 0;
    border-bottom: 1px solid var(--hair);
    font-size: .78rem;
    font-weight: 400;
    line-height: 1.3;
    text-align: left;
  }
  .location-suggestion:last-child { border-bottom: 0; }
  .location-suggestion:hover, .location-suggestion:focus-visible { background: #fff; color: var(--volt); }
  .site-save {
    padding: 6px 10px;
    font-size: .8rem;
    white-space: nowrap;
  }
  .site-save-status {
    display: block;
    color: var(--steel);
    font-size: .75rem;
    margin-top: 4px;
    min-height: 1em;
  }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(27,29,31,.72);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  /* Without this, the rule above beats the browser's own default styling
     for [hidden], and the modal shows up on load instead of staying
     hidden until something opens it. (Shared class now, not an ID, so
     every modal on this page gets the fix — not just the first one.) */
  .modal-overlay[hidden] {
    display: none;
  }
  #previewModal canvas {
    max-width: 90vw;
    margin-bottom: 12px;
  }
  .modal-overlay .box {
    position: relative;
    background: var(--panel-2);
    border: 1px solid var(--hair);
    border-radius: 3px;
    padding: clamp(20px, 3vw, 34px);
    text-align: center;
    max-height: 85vh;
    overflow: hidden;
  }
  .modal-overlay .box.wide {
    text-align: left;
    max-width: 640px;
    width: 90vw;
  }
  .modal-close {
    position: absolute;
    top: 10px;
    right: 12px;
    padding: 2px 6px;
    background: transparent;
    color: var(--steel);
    border: 0;
    font-size: 1.5rem;
    line-height: 1;
  }
  .modal-close:hover { background: transparent; color: var(--volt); }
  .modal-close:focus-visible { outline: 2px solid var(--volt); outline-offset: 2px; }
  .device-history-scroll.expanded {
    max-height: 55vh;
    overflow-y: auto;
  }
  .device-history-more {
    margin-top: 12px;
    padding: 6px 10px;
    font-size: .8rem;
  }
  .modal-overlay .box h2 {
    margin-top: 0;
    font-size: 1.35rem;
  }
  .status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 6px;
  }
  .status-dot.online { background: #37C77E; }
  .status-dot.stale { background: var(--hair); }
  .map-card { padding-bottom: 20px; }
  #deviceMap {
    width: 100%;
    height: min(52vh, 480px);
    min-height: 320px;
    border: 1px solid var(--hair);
    border-radius: 3px;
    background: var(--panel);
  }
  .google-map { font-family: inherit; }
  .pin-wrap { background: none; border: 0; }
  .pin { position: relative; width: 40px; height: 54px; cursor: pointer; }
  .pin-unit {
    position: absolute; left: 2px; top: 0; width: 36px; height: 31px;
    display: flex; flex-direction: column; gap: 2px; padding: 3px; border-radius: 3px;
    background: linear-gradient(152deg, #3B3F43 0%, #242729 55%, #15171A 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 6px 10px -5px rgba(18,24,22,.7);
    transform-origin: 50% 100%; transition: transform .18s ease;
  }
  .pin-sol {
    height: 3px; flex: none; border-radius: 1px; background-color: #6F4C9B;
    background-image: radial-gradient(rgba(0,0,0,.5) 40%, transparent 44%); background-size: 2px 2px;
  }
  .pin-scr { flex: 1; position: relative; overflow: hidden; border-radius: 1px; background: #fff; box-shadow: 0 0 0 .5px rgba(0,0,0,.6); }
  .pin-scr::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: #C8202C; }
  .pin-scr::after {
    content: ""; position: absolute; left: 2px; right: 2px; top: 5px; bottom: 2px;
    background: linear-gradient(#9AA0B2,#9AA0B2) 0 0/45% 1.5px no-repeat, linear-gradient(#9AA0B2,#9AA0B2) 0 4px/35% 1.5px no-repeat, linear-gradient(#9AA0B2,#9AA0B2) 0 8px/42% 1.5px no-repeat, radial-gradient(circle,#F2B632 45%,transparent 50%) 88% 30%/9px 9px no-repeat;
  }
  .pin-ad { position: absolute; inset: 0; z-index: 1; background: #1C46A8; opacity: 0; }
  .pin-post { position: absolute; left: 19px; top: 31px; width: 2px; height: 17px; background: linear-gradient(#2A2D30,#5C625E); }
  .pin-foot { position: absolute; left: 14px; top: 46px; width: 12px; height: 5px; border-radius: 50%; background: radial-gradient(rgba(18,24,22,.45),transparent 70%); }
  .pin-n {
    position: absolute; right: -6px; top: -7px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px;
    display: grid; place-items: center; background: var(--volt); color: #fff; font-size: 10px; line-height: 1;
    font-variation-settings: "wdth" 110, "wght" 700; box-shadow: 0 0 0 2px var(--panel-2);
  }
  .pin:hover .pin-unit { transform: translateY(-3px); }
  .map-status { color: var(--steel); font-size: .85rem; margin-top: 10px; min-height: 1.2em; }
  @media (max-width: 700px) {
    .nav { padding-block: 14px; }
    .nav-link { font-size: .85rem; }
    h1 { font-size: clamp(2.35rem, 12vw, 3.2rem); }
  }
</style>
</head>
<body>
  <header>
    <nav class="nav">
      <a href="../" class="wordmark">WALL<b>.</b></a>
      <a href="../" class="nav-link">Back to wall.marketing</a>
    </nav>
  </header>
  <main>
  <div class="wrap">
    <div class="whoami" id="whoami">Checking access...</div>
    <h1>Wall Marketing — Admin</h1>

    <div class="card">
      <h2>Generate test image</h2>
      <canvas id="canvas" width="800" height="480"></canvas>
      <button id="generateBtn">Generate new test image</button>
      <div class="status" id="genStatus"></div>
    </div>

    <div class="card">
      <h2>Image history</h2>
      <table>
        <thead>
          <tr><th>#</th><th>Created</th><th>Size</th><th></th></tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
      <div class="status" id="historyStatus"></div>
    </div>

    <div class="card map-card">
      <h2>Device locations</h2>
      <div id="deviceMap" role="region" aria-label="Map of device locations"></div>
      <div class="map-status" id="mapStatus"></div>
    </div>

    <div class="card">
      <h2>Devices</h2>
      <table>
        <thead>
          <tr>
            <th>Device</th><th>Site name</th><th>Site location</th><th>Last seen</th><th>Uptime</th><th>RSSI</th>
            <th>Heap</th><th>FW</th><th>Errors</th><th>Image</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="devicesBody"></tbody>
      </table>
      <div class="status" id="devicesStatus"></div>
    </div>
  </div>
  </main>

  <div id="previewModal" class="modal-overlay" hidden>
    <div class="box">
      <canvas id="previewCanvas" width="800" height="480"></canvas>
      <button id="closePreview">Close</button>
    </div>
  </div>

  <div id="deviceHistoryModal" class="modal-overlay" hidden>
    <div class="box wide">
      <button id="closeDeviceHistory" class="modal-close" type="button" aria-label="Close device history" title="Close">&times;</button>
      <h2 id="deviceHistoryTitle"></h2>
      <div id="deviceHistoryScroll" class="device-history-scroll">
        <table>
          <thead>
            <tr>
              <th>Checked in</th><th>Uptime</th><th>RSSI</th>
              <th>Heap</th><th>FW</th><th>Errors</th><th>Image</th>
            </tr>
          </thead>
          <tbody id="deviceHistoryBody"></tbody>
        </table>
      </div>
      <button id="deviceHistoryMore" class="device-history-more" type="button" hidden>Show more</button>
    </div>
  </div>

<script>
  const EPD_WIDTH = 800;
  const EPD_HEIGHT = 480;

  // Matches the Spectra 6 codes used in the firmware's epdColorBarsTest.
  const PALETTE = [
    { code: 0x0, rgb: [0, 0, 0] },       // black
    { code: 0x1, rgb: [255, 255, 255] }, // white
    { code: 0x2, rgb: [255, 255, 0] },   // yellow
    { code: 0x3, rgb: [255, 0, 0] },     // red
    { code: 0x5, rgb: [0, 0, 255] },     // blue
    { code: 0x6, rgb: [0, 255, 0] },     // green
  ];

  function nearestPaletteCode(r, g, b) {
    let bestCode = PALETTE[0].code;
    let bestDist = Infinity;
    for (const p of PALETTE) {
      const dr = r - p.rgb[0], dg = g - p.rgb[1], db = b - p.rgb[2];
      const dist = dr * dr + dg * dg + db * db;
      if (dist < bestDist) { bestDist = dist; bestCode = p.code; }
    }
    return bestCode;
  }

  function codeToRgb(code) {
    const p = PALETTE.find((p) => p.code === code);
    return p ? p.rgb : [128, 128, 128];
  }

  function drawTestPattern(ctx, number) {
    const colors = ['#000000', '#ffffff', '#ffff00', '#ff0000', '#0000ff', '#00ff00'];
    const barWidth = EPD_WIDTH / colors.length;
    colors.forEach((c, i) => {
      ctx.fillStyle = c;
      ctx.fillRect(i * barWidth, 0, barWidth, EPD_HEIGHT);
    });

    const text = String(number);
    ctx.font = 'bold 160px monospace';
    const textWidth = ctx.measureText(text).width;
    const boxW = textWidth + 80;
    const boxH = 200;
    const boxX = (EPD_WIDTH - boxW) / 2;
    const boxY = (EPD_HEIGHT - boxH) / 2;

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(boxX, boxY, boxW, boxH);
    ctx.fillStyle = '#000000';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, EPD_WIDTH / 2, boxY + boxH / 2 + 8);
  }

  // Packs canvas pixels into the same 4-bit-per-pixel, 2-pixels-per-byte
  // format the firmware streams directly to the panel — this Uint8Array
  // is exactly what a future device-side update would fetch and display.
  function canvasToPackedBytes(ctx) {
    const data = ctx.getImageData(0, 0, EPD_WIDTH, EPD_HEIGHT).data;
    const bytesPerRow = EPD_WIDTH / 2;
    const packed = new Uint8Array(bytesPerRow * EPD_HEIGHT);
    let out = 0;
    for (let y = 0; y < EPD_HEIGHT; y++) {
      for (let bx = 0; bx < bytesPerRow; bx++) {
        const x0 = bx * 2, x1 = bx * 2 + 1;
        const i0 = (y * EPD_WIDTH + x0) * 4;
        const i1 = (y * EPD_WIDTH + x1) * 4;
        const c0 = nearestPaletteCode(data[i0], data[i0 + 1], data[i0 + 2]);
        const c1 = nearestPaletteCode(data[i1], data[i1 + 1], data[i1 + 2]);
        packed[out++] = (c0 << 4) | c1;
      }
    }
    return packed;
  }

  function unpackBytesToCanvas(bytes, ctx) {
    const bytesPerRow = EPD_WIDTH / 2;
    const imgData = ctx.createImageData(EPD_WIDTH, EPD_HEIGHT);
    for (let y = 0; y < EPD_HEIGHT; y++) {
      for (let bx = 0; bx < bytesPerRow; bx++) {
        const byte = bytes[y * bytesPerRow + bx];
        const c0 = (byte >> 4) & 0xf;
        const c1 = byte & 0xf;
        const [r0, g0, b0] = codeToRgb(c0);
        const [r1, g1, b1] = codeToRgb(c1);
        const x0 = bx * 2, x1 = bx * 2 + 1;
        let i = (y * EPD_WIDTH + x0) * 4;
        imgData.data[i] = r0; imgData.data[i + 1] = g0; imgData.data[i + 2] = b0; imgData.data[i + 3] = 255;
        i = (y * EPD_WIDTH + x1) * 4;
        imgData.data[i] = r1; imgData.data[i + 1] = g1; imgData.data[i + 2] = b1; imgData.data[i + 3] = 255;
      }
    }
    ctx.putImageData(imgData, 0, 0);
  }

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  const genStatus = document.getElementById('genStatus');
  const generateBtn = document.getElementById('generateBtn');

  async function generateImage() {
    generateBtn.disabled = true;
    genStatus.textContent = 'Generating...';
    try {
      const historyResp = await fetch('/api/images?limit=1');
      const history = await historyResp.json();
      const nextNumber = (history[0]?.number ?? 0) + 1;

      drawTestPattern(ctx, nextNumber);
      const packed = canvasToPackedBytes(ctx);

      const uploadResp = await fetch(`/api/images?number=${nextNumber}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/octet-stream' },
        body: packed,
      });

      if (!uploadResp.ok) {
        genStatus.textContent = 'Upload failed: ' + (await uploadResp.text());
        return;
      }

      const row = await uploadResp.json();
      genStatus.textContent = `Image #${row.number} generated and stored (${row.byte_size} bytes).`;
      loadHistory();
    } catch (err) {
      genStatus.textContent = 'Error: ' + err.message;
    } finally {
      generateBtn.disabled = false;
    }
  }

  generateBtn.addEventListener('click', generateImage);

  const historyBody = document.getElementById('historyBody');
  const historyStatus = document.getElementById('historyStatus');

  async function loadHistory() {
    historyStatus.textContent = 'Loading...';
    try {
      const resp = await fetch('/api/images');
      const rows = await resp.json();
      historyBody.innerHTML = '';
      for (const row of rows) {
        const tr = document.createElement('tr');
        const created = row.created_at ? row.created_at.replace('T', ' ') : '';
        tr.innerHTML = `
          <td>${row.number}</td>
          <td>${created}</td>
          <td>${row.byte_size ?? '—'} bytes</td>
          <td><button class="preview-btn" data-id="${row.id}">Preview</button></td>
        `;
        historyBody.appendChild(tr);
      }
      historyStatus.textContent = rows.length ? '' : 'No images generated yet.';
      historyBody.querySelectorAll('.preview-btn').forEach((btn) => {
        btn.addEventListener('click', () => previewImage(btn.dataset.id));
      });
    } catch (err) {
      historyStatus.textContent = 'Failed to load history: ' + err.message;
    }
  }

  const previewModal = document.getElementById('previewModal');
  const previewCanvas = document.getElementById('previewCanvas');
  const previewCtx = previewCanvas.getContext('2d');

  async function previewImage(id) {
    const resp = await fetch(`/api/images/${id}/raw`);
    if (!resp.ok) return;
    const bytes = new Uint8Array(await resp.arrayBuffer());
    unpackBytesToCanvas(bytes, previewCtx);
    previewModal.hidden = false;
  }

  async function previewDeviceImage(deviceId, button) {
    button.disabled = true;
    try {
      const resp = await fetch(`/api/devices/${encodeURIComponent(deviceId)}/image`);
      if (!resp.ok) throw new Error(await resp.text());
      const bytes = new Uint8Array(await resp.arrayBuffer());
      unpackBytesToCanvas(bytes, previewCtx);
      previewModal.hidden = false;
    } catch (err) {
      devicesStatus.textContent = 'Could not load device image: ' + err.message;
    } finally {
      button.disabled = false;
    }
  }

  document.getElementById('closePreview').addEventListener('click', () => {
    previewModal.hidden = true;
  });

  // D1's datetime('now') gives UTC with no timezone suffix, so we have to
  // tell the Date constructor it's UTC ourselves or it gets parsed as local
  // time and every "last seen" ends up hours off.
  function parseUtc(sqliteTimestamp) {
    return new Date(sqliteTimestamp.replace(' ', 'T') + 'Z').getTime();
  }

  function formatRelativeTime(sqliteTimestamp) {
    if (!sqliteTimestamp) return 'never';
    const diffSec = Math.max(0, Math.round((Date.now() - parseUtc(sqliteTimestamp)) / 1000));
    if (diffSec < 60) return `${diffSec}s ago`;
    if (diffSec < 3600) return `${Math.floor(diffSec / 60)}m ago`;
    if (diffSec < 86400) return `${Math.floor(diffSec / 3600)}h ago`;
    return `${Math.floor(diffSec / 86400)}d ago`;
  }

  const devicesBody = document.getElementById('devicesBody');
  const devicesStatus = document.getElementById('devicesStatus');
  const mapStatus = document.getElementById('mapStatus');
  let deviceMap = null;
  let deviceMarkers = [];
  let deviceInfoWindow = null;
  let AdvancedMarkerElement = null;
  const defaultMapZoom = 17;

  const deviceMapReady = (async () => {
    const configResponse = await fetch('/api/maps-config');
    if (!configResponse.ok) throw new Error('Google Maps is not configured');
    const config = await configResponse.json();
    await new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(config.key)}&libraries=marker`;
      script.async = true;
      script.defer = true;
      script.onload = resolve;
      script.onerror = () => reject(new Error('Google Maps failed to load'));
      document.head.appendChild(script);
    });
    deviceMap = new google.maps.Map(document.getElementById('deviceMap'), {
      center: { lat: 30.2745, lng: -97.7420 },
      zoom: defaultMapZoom,
      mapId: 'DEMO_MAP_ID',
      mapTypeControl: false,
      streetViewControl: false,
      fullscreenControl: false,
      styles: [
        { elementType: 'geometry', stylers: [{ color: '#E6E9E4' }] },
        { elementType: 'labels.text.fill', stylers: [{ color: '#5C625E' }] },
        { elementType: 'labels.text.stroke', stylers: [{ color: '#F4F6F2' }] },
        { featureType: 'administrative', elementType: 'geometry.stroke', stylers: [{ color: '#CBD1CA' }] },
        { featureType: 'road', elementType: 'geometry', stylers: [{ color: '#F4F6F2' }] },
        { featureType: 'road', elementType: 'geometry.stroke', stylers: [{ color: '#CBD1CA' }] },
        { featureType: 'water', elementType: 'geometry', stylers: [{ color: '#D5DDD8' }] },
        { featureType: 'poi', stylers: [{ visibility: 'off' }] },
      ],
    });
    ({ AdvancedMarkerElement } = await google.maps.importLibrary('marker'));
    deviceInfoWindow = new google.maps.InfoWindow();
  })();

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, (character) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[character]));
  }

  function wallPinElement() {
    const pin = document.createElement('div');
    pin.className = 'pin-wrap';
    pin.innerHTML = '<div class="pin"><span class="pin-foot"></span><span class="pin-post"></span><span class="pin-unit"><i class="pin-sol"></i><span class="pin-scr"><span class="pin-ad"></span></span><i class="pin-sol"></i></span><span class="pin-n">1</span></div>';
    return pin;
  }

  async function renderDeviceMap(rows) {
    try {
      await deviceMapReady;
    } catch (err) {
      mapStatus.textContent = err.message;
      return;
    }
    deviceMarkers.forEach((marker) => marker.setMap(null));
    deviceMarkers = [];
    const locatedRows = rows.filter((row) => Number.isFinite(Number(row.site_latitude)) && Number.isFinite(Number(row.site_longitude)));
    if (!locatedRows.length) {
      mapStatus.textContent = 'No devices have a geocoded site location yet.';
      return;
    }
    const bounds = [];
    locatedRows.forEach((row) => {
      const point = [Number(row.site_latitude), Number(row.site_longitude)];
      bounds.push(point);
      const label = row.site_name || row.device_id;
      const detail = row.site_location || 'Location not named';
      const marker = new AdvancedMarkerElement({
        position: { lat: point[0], lng: point[1] },
        map: deviceMap,
        title: label,
        content: wallPinElement(),
      });
      marker.addListener('click', () => {
        deviceInfoWindow.setContent(`<strong>${escapeHtml(label)}</strong><br>${escapeHtml(detail)}<br><small>${escapeHtml(row.device_id)}</small>`);
        deviceInfoWindow.open({ anchor: marker, map: deviceMap });
      });
      deviceMarkers.push(marker);
    });
    mapStatus.textContent = `${locatedRows.length} of ${rows.length} device${rows.length === 1 ? '' : 's'} mapped.`;
    const mapBounds = new google.maps.LatLngBounds();
    bounds.forEach((point) => mapBounds.extend({ lat: point[0], lng: point[1] }));
    deviceMap.fitBounds(mapBounds, 40);
    deviceMap.setZoom(defaultMapZoom);
  }

  function attachLocationSuggestions(input) {
    const editor = input.parentElement;
    const suggestions = document.createElement('div');
    suggestions.className = 'location-suggestions';
    suggestions.hidden = true;
    editor.appendChild(suggestions);
    let searchTimer = null;
    let searchRequest = 0;

    function closeSuggestions() {
      suggestions.hidden = true;
      suggestions.innerHTML = '';
    }

    input.addEventListener('input', () => {
      clearTimeout(searchTimer);
      const query = input.value.trim();
      if (query.length < 3) {
        closeSuggestions();
        return;
      }
      searchTimer = setTimeout(async () => {
        const requestId = ++searchRequest;
        try {
          const response = await fetch(`/api/location-search?q=${encodeURIComponent(query)}`);
          if (requestId !== searchRequest || !response.ok) return;
          const results = await response.json();
          suggestions.innerHTML = '';
          results.forEach((result) => {
            const option = document.createElement('button');
            option.type = 'button';
            option.className = 'location-suggestion';
            option.textContent = result.label;
            option.addEventListener('click', () => {
              input.value = result.label;
              closeSuggestions();
              input.focus();
            });
            suggestions.appendChild(option);
          });
          suggestions.hidden = results.length === 0;
        } catch {
          closeSuggestions();
        }
      }, 300);
    });
    input.addEventListener('blur', () => setTimeout(closeSuggestions, 150));
  }

  async function saveDeviceSite(deviceId, siteNameInput, siteLocationInput, saveButton, saveStatus) {
    saveButton.disabled = true;
    saveStatus.textContent = 'Saving...';
    try {
      const resp = await fetch(`/api/devices/${encodeURIComponent(deviceId)}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          site_name: siteNameInput.value,
          site_location: siteLocationInput.value,
        }),
      });
      const result = await resp.json();
      if (!resp.ok) throw new Error(result.error || 'Could not save site details');
      saveStatus.textContent = 'Saved';
      loadDevices();
    } catch (err) {
      saveStatus.textContent = 'Error: ' + err.message;
    } finally {
      saveButton.disabled = false;
    }
  }

  async function loadDevices() {
    try {
      const resp = await fetch('/api/devices');
      const rows = await resp.json();
      renderDeviceMap(rows);
      devicesBody.innerHTML = '';
      for (const row of rows) {
        const tr = document.createElement('tr');
        // Poll cycle is ~1 minute — call it stale after three missed cycles
        // rather than flagging a device offline over one slow check-in.
        const secSinceSeen = row.last_seen_at ? (Date.now() - parseUtc(row.last_seen_at)) / 1000 : Infinity;
        const dotClass = secSinceSeen < 180 ? 'online' : 'stale';
        const name = row.friendly_name ? `${row.device_id} (${row.friendly_name})` : row.device_id;
        tr.innerHTML = `
          <td>${name}</td>
          <td class="site-edit-cell"></td>
          <td class="site-edit-cell"></td>
          <td><button type="button" class="last-seen-btn" title="View check-in history"><span class="status-dot ${dotClass}"></span>${formatRelativeTime(row.last_seen_at)}</button></td>
          <td>${row.uptime_seconds ?? '—'}s</td>
          <td>${row.rssi ?? '—'}</td>
          <td>${row.free_heap ?? '—'}</td>
          <td>${row.firmware_version ?? '—'}</td>
          <td>${row.error_count ?? '—'}</td>
          <td class="image-cell"></td>
          <td class="site-edit-actions">
            <button type="button" class="site-save">Save</button>
            <span class="site-save-status" aria-live="polite"></span>
          </td>
        `;

        const siteCells = tr.querySelectorAll('.site-edit-cell');
        const imageCell = tr.querySelector('.image-cell');
        const imageButton = document.createElement('button');
        imageButton.type = 'button';
        imageButton.className = 'preview-btn';
        imageButton.textContent = row.image_hash ? 'Preview' : 'Unavailable';
        imageButton.disabled = !row.image_hash;
        imageButton.title = row.image_hash ? 'Preview the image currently reported by this device' : 'This device has not reported an image';
        imageButton.addEventListener('click', () => previewDeviceImage(row.device_id, imageButton));
        imageCell.appendChild(imageButton);

        const siteNameInput = document.createElement('input');
        siteNameInput.className = 'site-input';
        siteNameInput.type = 'text';
        siteNameInput.maxLength = 200;
        siteNameInput.placeholder = 'Site name';
        siteNameInput.value = row.site_name || '';
        siteCells[0].appendChild(siteNameInput);

        const siteLocationEditor = document.createElement('div');
        siteLocationEditor.className = 'location-editor';
        const siteLocationInput = document.createElement('input');
        siteLocationInput.className = 'site-input';
        siteLocationInput.type = 'text';
        siteLocationInput.maxLength = 200;
        siteLocationInput.placeholder = 'Site location';
        siteLocationInput.value = row.site_location || '';
        siteLocationEditor.appendChild(siteLocationInput);
        siteCells[1].appendChild(siteLocationEditor);
        attachLocationSuggestions(siteLocationInput);

        tr.querySelectorAll('.site-edit-cell, .site-edit-actions').forEach((cell) => {
          cell.addEventListener('click', (event) => event.stopPropagation());
        });
        const saveButton = tr.querySelector('.site-save');
        const lastSeenButton = tr.querySelector('.last-seen-btn');
        const saveStatus = tr.querySelector('.site-save-status');
        saveButton.addEventListener('click', () => saveDeviceSite(
          row.device_id, siteNameInput, siteLocationInput, saveButton, saveStatus
        ));
        lastSeenButton.addEventListener('click', () => openDeviceHistory(row.device_id));
        devicesBody.appendChild(tr);
      }
      devicesStatus.textContent = rows.length ? '' : 'No devices have checked in yet.';
    } catch (err) {
      devicesStatus.textContent = 'Failed to load devices: ' + err.message;
    }
  }

  const deviceHistoryModal = document.getElementById('deviceHistoryModal');
  const deviceHistoryTitle = document.getElementById('deviceHistoryTitle');
  const deviceHistoryBody = document.getElementById('deviceHistoryBody');
  const deviceHistoryScroll = document.getElementById('deviceHistoryScroll');
  const deviceHistoryMore = document.getElementById('deviceHistoryMore');
  const deviceHistoryPageSize = 10;
  let deviceHistoryRows = [];
  let deviceHistoryVisibleCount = deviceHistoryPageSize;

  function renderDeviceHistory() {
    deviceHistoryBody.innerHTML = '';
    const visibleRows = deviceHistoryRows.slice(0, deviceHistoryVisibleCount);
    for (const row of visibleRows) {
      const tr = document.createElement('tr');
      const checkedIn = row.checked_in_at ? row.checked_in_at.replace('T', ' ') : '';
      tr.innerHTML = `
        <td>${checkedIn}</td>
        <td>${row.uptime_seconds ?? '—'}s</td>
        <td>${row.rssi ?? '—'}</td>
        <td>${row.free_heap ?? '—'}</td>
        <td>${row.firmware_version ?? '—'}</td>
        <td>${row.error_count ?? '—'}</td>
        <td>${row.image_hash ?? '—'}</td>
      `;
      deviceHistoryBody.appendChild(tr);
    }
    if (!deviceHistoryRows.length) {
      deviceHistoryBody.innerHTML = '<tr><td colspan="7">No check-ins recorded.</td></tr>';
    }
    deviceHistoryMore.hidden = deviceHistoryVisibleCount >= deviceHistoryRows.length;
    deviceHistoryScroll.classList.toggle('expanded', deviceHistoryVisibleCount > deviceHistoryPageSize);
  }

  async function openDeviceHistory(deviceId) {
    deviceHistoryTitle.textContent = deviceId;
    deviceHistoryBody.innerHTML = '<tr><td colspan="7">Loading...</td></tr>';
    deviceHistoryRows = [];
    deviceHistoryVisibleCount = deviceHistoryPageSize;
    deviceHistoryMore.hidden = true;
    deviceHistoryScroll.classList.remove('expanded');
    deviceHistoryModal.hidden = false;
    try {
      const resp = await fetch(`/api/devices/${encodeURIComponent(deviceId)}/checkins?limit=200`);
      deviceHistoryRows = await resp.json();
      renderDeviceHistory();

    } catch (err) {
      deviceHistoryBody.innerHTML = `<tr><td colspan="7">Failed to load: ${err.message}</td></tr>`;
    }
  }

  deviceHistoryMore.addEventListener('click', () => {
    deviceHistoryVisibleCount += deviceHistoryPageSize;
    renderDeviceHistory();
  });

  document.getElementById('closeDeviceHistory').addEventListener('click', () => {
    deviceHistoryModal.hidden = true;
  });

  // Access identity check, same as before — just a quiet status line now.
  fetch('/api/whoami')
    .then((r) => r.json())
    .then((data) => {
      document.getElementById('whoami').textContent = data.email
        ? `Signed in as ${data.email}`
        : 'Access identity not detected';
    })
    .catch(() => {
      document.getElementById('whoami').textContent = 'Could not reach /api/whoami';
    });

  loadHistory();
  loadDevices();
  // Fleet status should feel roughly live without the page constantly
  // refetching images — 30s is frequent enough to feel current without
  // hammering D1 on every open admin tab.
  setInterval(loadDevices, 30000);
</script>
</body>
</html>
